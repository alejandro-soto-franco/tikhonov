[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
#
# Linux x86_64 only. tikhonov-cli links system HDF5 through hdf5-metno 0.12,
# which is declared without the `static` feature, so every target needs an
# HDF5 development package present on the runner. Widening this means either
# turning on the hdf5-metno `static` feature, so HDF5 builds from source, or
# adding a per-target system package below and confirming it resolves.
targets = ["x86_64-unknown-linux-gnu"]

# tikhonov-cli will not link without these on the runner.
[dist.dependencies.apt]
libhdf5-dev = '*'
pkg-config = '*'
