[build-system]
requires      = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name            = "tikhonov"
version         = "0.1.0"
description     = "Harmony2 single-cell data integration (pure Rust, Python bindings)"
readme          = "README.md"
license         = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords        = ["bioinformatics", "single-cell", "harmony", "integration", "scRNA-seq"]
authors         = [{ name = "Alejandro Soto Franco", email = "sotofranco.eng@gmail.com" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "anndata>=0.10",
]

[project.urls]
Repository    = "https://github.com/alejandro-soto-franco/tikhonov"
Documentation = "https://github.com/alejandro-soto-franco/tikhonov/blob/main/crates/tikhonov-py/README.md"

[tool.maturin]
python-source = "python"
module-name   = "tikhonov._core"
bindings      = "pyo3"
features      = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers   = [
    "integration: tests that require network or external data",
]

[tool.pyrefly]
# Enables full Pyrefly type checking; run with `uvc`. See ~/.claude/rules/pyrefly.md
