name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: clippy
      - name: Install libhdf5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1

      - name: Install libhdf5 (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Test full workspace (ubuntu)
        if: runner.os == 'Linux'
        run: cargo test --workspace --all-features

      - name: Test core crate only (macos, windows)
        if: runner.os != 'Linux'
        run: cargo test -p tikhonov --all-features
      # `tikhonov-cli` depends on `hdf5-metno-sys 0.11.2` which cannot parse
      # HDF5 2.x headers shipped by Homebrew / msys2 as of 2026-04. Linux
      # tests the full workspace; the algorithm core is exercised on all
      # three OSes here.

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Python tooling
        run: pip install --upgrade pip maturin pytest numpy pandas anndata
      - name: Build + install wheel
        working-directory: crates/tikhonov-py
        run: maturin develop --release
      - name: Run pytest
        working-directory: crates/tikhonov-py
        run: pytest -v
