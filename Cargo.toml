[workspace]
resolver = "3"
members = ["crates/tikhonov", "crates/tikhonov-cli", "crates/tikhonov-py"]

[workspace.package]
version       = "0.1.0"
edition       = "2024"
rust-version  = "1.85"
license       = "Apache-2.0"
repository    = "https://github.com/alejandro-soto-franco/tikhonov"
authors       = ["Alejandro Soto Franco <sotofranco.eng@gmail.com>"]

[workspace.dependencies]
ndarray      = { version = "0.17", features = ["rayon", "serde"] }
rayon        = "1.10"
thiserror    = "2"
rand_chacha  = "0.9"
rand         = "0.9"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
faer         = "0.22"
hdf5-metno   = "0.12"
clap         = { version = "4", features = ["derive"] }
md5          = "0.7"
pyo3         = { version = "0.28", features = ["extension-module", "abi3-py310"] }
numpy        = "0.28"

[profile.release]
lto         = "thin"
codegen-units = 1
debug       = "line-tables-only"
